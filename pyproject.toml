[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-engine"
version = "0.8.0"
description = "Live institutional risk engine: VaR, Expected Shortfall, GARCH and backtesting"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "arch>=6.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[project.optional-dependencies]
# Phases 9 and 10 read Module 1's ratios and stress Module 2's DCF. They are optional
# because the market-risk core of this engine stands on its own, and a consumer who wants
# VaR should not be made to install two other engines to get it. The modules that need them
# import lazily and raise a message naming this extra.
integration = [
    "financial-statement-intelligence @ git+https://github.com/kaotekwarrushikesh-dotcom/financial-statement-intelligence.git@main",
    "valuation-engine @ git+https://github.com/kaotekwarrushikesh-dotcom/valuation-engine.git@main",
]

[tool.setuptools.packages.find]
# Only the library package is distributed. The Streamlit dashboard, notebooks and the
# stage scripts are development entry points and deliberately stay out of the wheel, so
# that installing this engine as a dependency pulls in the calculations and nothing else.
include = ["risk_engine*"]
